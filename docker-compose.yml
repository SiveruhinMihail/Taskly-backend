version: '3.8'

services:
  backend-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: backend-prod
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001
    env_file:
      - .env.production
    volumes:
      - /usr/src/app/node_modules
    restart: unless-stopped

  mongodb-prod:
    image: mongo:6
    container_name: mongodb-prod
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 89450
      MONGO_INITDB_DATABASE: taskly
    ports:
      - '27017:27017'
    volumes:
      - mongodb_prod_data:/data/db
    restart: unless-stopped

volumes:
  mongodb_prod_data:
